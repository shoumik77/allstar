services:
  postgres:
    image: postgres:16
    container_name: pickclash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pickclash
      POSTGRES_PASSWORD: pickclash
      POSTGRES_DB: pickclash
    ports:
      - "5433:5432"
    volumes:
      - pickclash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickclash -d pickclash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pickclash-pgdata:
